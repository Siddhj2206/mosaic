[workspace]
members = ["crates/mosaic-core", "crates/mosaic-scrapers"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[package]
name = "mosaic"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mosaic"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
env_logger = "0.11.11"
gpui = "0.2.2"
jiff = "0.2.35"
log = "0.4.33"
mosaic-core = { version = "0.1.0", path = "crates/mosaic-core" }
mosaic-scrapers = { version = "0.1.0", path = "crates/mosaic-scrapers" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
